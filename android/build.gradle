// dev.mediacache:alpha-video-gpu, the Android library on its own (no React Native).
// The React Native package builds these same sources from react-native/android/build.gradle.

buildscript {
    // Only when this directory is built on its own; inside an app, the app's plugin is used.
    if (project == rootProject) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.android.tools.build:gradle:8.12.0'
        }
    }
}

apply plugin: 'com.android.library'

def safeExtGet(name, fallback) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

group = 'dev.mediacache'
version = '1.0.0'

android {
    namespace 'dev.mediacache.alphavideo.gpu'
    compileSdk safeExtGet('compileSdkVersion', 36)
    ndkVersion safeExtGet('ndkVersion', '27.1.12297006')

    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 24)

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                // One .so with only a JNI surface, so the runtime is linked in and the AAR ships no
                // libc++_shared.so to collide with other libraries' copies
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    // JVM tests of the pure-Java parts (./gradlew test), on the fixtures in ../tests/fixtures
    testImplementation 'junit:junit:4.13.2'
}

if (project == rootProject) {
    apply from: 'publish.gradle'
}
